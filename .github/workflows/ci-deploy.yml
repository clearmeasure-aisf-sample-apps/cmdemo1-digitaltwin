name: CI and Deploy Digital Twin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_rebuild:
        description: Rebuild all twin state from raw events twice and require identical read models (pauses live intake while it runs)
        type: boolean
        default: false

permissions:
  contents: read

# The observed platform: repository variables override cmdemo1's defaults (docs/setup/README.md).
env:
  TWIN_SYSTEM_SLUG: ${{ vars.TWIN_SYSTEM_SLUG || 'cmdemo1' }}
  TWIN_RESOURCE_GROUP: ${{ vars.TWIN_RESOURCE_GROUP || 'rg-cmdemo1-nonprod' }}
  ACR_NAME: ${{ vars.TWIN_ACR_NAME || 'acrcmdemo1chu4gq' }}
  TWIN_PLATFORM_FILE: ${{ vars.TWIN_PLATFORM_FILE || '' }}
  TWIN_GITHUB_ORG: ${{ vars.TWIN_GITHUB_ORG || 'clearmeasure-aisf-sample-apps' }}
  TWIN_OCTOPUS_SPACE: ${{ vars.TWIN_OCTOPUS_SPACE || 'Spaces-355' }}

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore solution
        run: dotnet restore cmdemo1-digitaltwin.sln

      - name: Build solution
        run: dotnet build cmdemo1-digitaltwin.sln --configuration Release --no-restore

      - name: Test solution (unit, architecture, Testcontainers SQL Server integration)
        run: dotnet test cmdemo1-digitaltwin.sln --configuration Release --no-build --verbosity normal

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/main.bicep
          az bicep build --file infra/eventgrid.bicep
          az bicep build --file infra/servicebus.bicep

      - name: Validate deploy scripts
        run: for f in deploy/scripts/*.sh scripts/*.sh deploy/octopus/terraform/steps/*.sh; do bash -n "$f"; done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Octopus definitions (Terraform, not applied)
        working-directory: deploy/octopus/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  release-candidate:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.rc.outputs.version }}
      image: ${{ steps.rc.outputs.image }}
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Azure login
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: bash deploy/scripts/azure-login.sh

      - name: Build and push the release candidate image to ACR
        id: rc
        run: |
          set -euo pipefail
          ACR_RG="${TWIN_RESOURCE_GROUP}"
          az acr update --name "$ACR_NAME" --resource-group "$ACR_RG" --admin-enabled true --output none
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --resource-group "$ACR_RG" --query username -o tsv)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --resource-group "$ACR_RG" --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$ACR_PASS"

          VERSION="1.0.${{ github.run_number }}"
          IMAGE="${ACR_NAME}.azurecr.io/${TWIN_SYSTEM_SLUG}/digitaltwin:${VERSION}"
          echo "$ACR_PASS" | docker login "${ACR_NAME}.azurecr.io" -u "$ACR_USER" --password-stdin
          docker build --build-arg "VERSION=${VERSION}" --tag "$IMAGE" .
          docker push "$IMAGE"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Package the release candidate for Octopus
        env:
          VERSION: ${{ steps.rc.outputs.version }}
          IMAGE: ${{ steps.rc.outputs.image }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZIP=$(bash deploy/scripts/package-twin.sh)
          unzip -l "$ZIP"
          echo "## Release candidate ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Octopus package: \`$(basename "$ZIP")\` (workflow artifact)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cmdemo1-digitaltwin.${{ steps.rc.outputs.version }}
          path: out/cmdemo1-digitaltwin.${{ steps.rc.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

  # Off unless the Octopus owner applies deploy/octopus/terraform and sets the repository variable TWIN_OCTOPUS_RELEASES=true.
  # Pushes the package to the space's built-in feed and creates a release; it never deploys or promotes.
  octopus-release:
    needs: release-candidate
    if: github.event_name != 'pull_request' && vars.TWIN_OCTOPUS_RELEASES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cmdemo1-digitaltwin.${{ needs.release-candidate.outputs.version }}

      - name: Push the package and create the Octopus release
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          VERSION: ${{ needs.release-candidate.outputs.version }}
          SPACE: ${{ vars.TWIN_OCTOPUS_SPACE || 'Spaces-355' }}
          PROJECT: ${{ vars.TWIN_OCTOPUS_PROJECT || 'cmdemo1-digitaltwin' }}
        run: |
          set -euo pipefail
          BASE="${OCTOPUS_URL%/}"
          curl -fsS -X POST -H "X-Octopus-ApiKey: ${OCTOPUS_API_KEY}" -F "file=@cmdemo1-digitaltwin.${VERSION}.zip" \
            "${BASE}/api/${SPACE}/packages/raw?overwriteMode=IgnoreIfExists" | jq -c '{PackageId, Version}'
          jq -n --arg space "$SPACE" --arg project "$PROJECT" --arg v "$VERSION" \
            '{spaceIdOrName: $space, projectName: $project, releaseVersion: $v, packageVersion: $v}' \
            | curl -fsS -X POST -H "X-Octopus-ApiKey: ${OCTOPUS_API_KEY}" -H "Content-Type: application/json" -d @- \
                "${BASE}/api/${SPACE}/releases/create/v1" | jq -c '{ReleaseId, ReleaseVersion}'

  # Direct deploy of each release candidate. Once the Octopus project is applied and deploying, set the repository
  # variable TWIN_DEPLOY_VIA_OCTOPUS=true to hand deploys to Octopus (the same scripts run there).
  deploy:
    needs: release-candidate
    if: github.event_name != 'pull_request' && vars.TWIN_DEPLOY_VIA_OCTOPUS != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Azure login
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: bash deploy/scripts/azure-login.sh

      - name: Deploy the release candidate (rebuild deferral, Bicep, revision ready)
        id: bicep
        env:
          IMAGE: ${{ needs.release-candidate.outputs.image }}
          VERSION: ${{ needs.release-candidate.outputs.version }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          TWIN_API_KEY: ${{ secrets.TWIN_API_KEY }}
        run: bash deploy/scripts/deploy-twin.sh

      - name: Register GitHub webhooks, Octopus subscription, and Azure Event Grid
        env:
          TWIN_URL: ${{ steps.bicep.outputs.twin_url }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ENABLE_EVENT_GRID_DEPLOY: ${{ vars.ENABLE_EVENT_GRID_DEPLOY || 'true' }}
        run: |
          chmod +x scripts/register-hooks.sh
          ./scripts/register-hooks.sh

      - name: Health gate (version, dead letters, storage, MCP)
        env:
          TWIN_URL: ${{ steps.bicep.outputs.twin_url }}
          TWIN_API_KEY: ${{ secrets.TWIN_API_KEY }}
          EXPECTED_VERSION: ${{ needs.release-candidate.outputs.version }}
        run: bash deploy/scripts/verify-twin.sh

      - name: Verify API, MCP, and Backfill
        env:
          TWIN_URL: ${{ steps.bicep.outputs.twin_url }}
          TWIN_API_KEY: ${{ secrets.TWIN_API_KEY }}
          VERIFY_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_rebuild }}
        run: |
          set -euo pipefail
          curl -fsS -m 120 -X POST -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/backfill" | jq '{gitHubOk, octopusOk, azureOk, probesOk, activeDriftCount, notes}'
          # Full rebuild from raw events into shadow tables (opt-in: it is IO-heavy on the 5 DTU database; intake keeps flowing).
          # Pass 1 may re-normalize the journal after a mapping change but must reproduce identical read models;
          # pass 2 must then be identical in every fingerprint, journal included.
          rebuild() {
            local previous="$1"
            curl -fsS -X POST -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/rebuild?wait=false" >/dev/null
            for i in $(seq 1 360); do
              STATUS=$(curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/rebuild/status")
              if [ "$(echo "$STATUS" | jq -r .running)" = "false" ] && [ "$(echo "$STATUS" | jq -r --arg p "$previous" '(.lastReport != null and .lastReport.startedAt != $p) or .lastError != null')" = "true" ]; then break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "$STATUS" | jq -c '{running, startedAt, rawEventsReplayedSoFar}' >&2; fi
              sleep 5
            done
            echo "$STATUS" | jq '{running, lastError, report: (.lastReport | {swapped, livePausedMilliseconds, stepSeconds, failures: (.failures // [])[:5], catchUpEventsReplayed, aborted, identical, readModelsIdentical, startedAt, finishedAt, rawEventsReplayed, rawEventsFailed, journalEventsRebuilt, differences, fingerprintAfter})}' >&2
            echo "$STATUS"
          }
          # Storage: database usage stays well under the Basic tier's 2 GB; old raw events live in the Blob archive.
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/storage" \
            | jq '{database: {usedMb: .database.usedMb, maxMb: .database.maxMb, largestTablesMb: .database.largestTablesMb}, rawIntake: {total: .rawIntake.total, deadLettered: .rawIntake.deadLettered}, archive: {enabled: .archive.enabled, days: .archive.days, oldestDay: .archive.oldestDay}}'
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/storage" | jq -e '.archive.enabled == true and .database.usedMb < 1500' >/dev/null
          if [ "${VERIFY_REBUILD}" = "true" ]; then
            FIRST=$(rebuild "")
            echo "$FIRST" | jq -e '.lastReport.swapped == true and .lastReport.readModelsIdentical == true and .lastReport.rawEventsFailed == 0' >/dev/null
            SECOND=$(rebuild "$(echo "$FIRST" | jq -r .lastReport.startedAt)")
            echo "$SECOND" | jq -e '.lastReport.identical == true' >/dev/null
          else
            echo "Rebuild verification skipped (run this workflow manually with verify_rebuild=true)."
          fi
          # Time travel: state reconstructed from the journal ten minutes ago.
          AS_OF=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS --retry 3 --retry-all-errors --retry-delay 20 -m 150 -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/state-at?asOf=${AS_OF}" \
            | jq '{asOf, historyStartsAt, beforeHistory, environments: [.environments[] | {stage, deployedVersions, lastDeployment}], azureResources: (.azureResources | length), boardColumns, activeDrift}'
          # Change chains: the most recent delivered change end to end, and the number of chains observed.
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/change-chains?limit=100" \
            | jq '{chains: .matchCount, latestDelivered: ([.chains[] | select(.outcome == "Delivered")][0] | {chainId, title, workItemNumber, pullRequestNumber, releaseId, leadTimeHours, stages: [.stages[] | {kind, status, reference, durationMinutes, failedAttempts}]})}'
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/twin/summary" | jq '{systemSlug, activeDriftCount, criticalDriftCount, pipelinesCount: (.pipelines | length), stagesCount: (.stages | length), webhooksCount: (.webhooks | length), webhooks: [.webhooks[] | {id, source, target, isActive, lastDeliveryStatusCode, detail}], costMonthToDateUsd, gitHubQuota}'
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/drift" | jq 'length'
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/metrics?windowDays=7&stage=prod" | jq '{totalDeployments, deploymentsPerDay, medianLeadTimeHours, changeFailRatePercent}'
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/workitems?limit=3" | jq 'length'
          LLMS_TXT=$(curl -fsS "${TWIN_URL}/llms.txt")
          printf '%s\n' "$LLMS_TXT" | head -n 5
          MCP_INIT_PAYLOAD='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}'
          MCP_INIT_RESP=$(curl -fsS -X POST "${TWIN_URL}/mcp" \
            -H "X-Twin-Key: ${TWIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "$MCP_INIT_PAYLOAD")
          echo "${MCP_INIT_RESP:0:300}"
          MCP_TOOLS_PAYLOAD='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          MCP_TOOLS_RESP=$(curl -fsS -X POST "${TWIN_URL}/mcp" \
            -H "X-Twin-Key: ${TWIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "$MCP_TOOLS_PAYLOAD")
          printf '%s\n' "$MCP_TOOLS_RESP" | grep -oE '"name":"[^"]+"'
          MCP_CALL_PAYLOAD='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_summary","arguments":{}}}'
          MCP_CALL_RESP=$(curl -fsS -X POST "${TWIN_URL}/mcp" \
            -H "X-Twin-Key: ${TWIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "$MCP_CALL_PAYLOAD")
          echo "${MCP_CALL_RESP:0:400}"
          echo "$MCP_CALL_RESP" | grep -q "Clear Measure Demo Platform"
          MCP_INTAKE_PAYLOAD='{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_intake_queue","arguments":{}}}'
          MCP_INTAKE_RESP=$(curl -fsS -X POST "${TWIN_URL}/mcp" \
            -H "X-Twin-Key: ${TWIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "$MCP_INTAKE_PAYLOAD")
          echo "${MCP_INTAKE_RESP:0:600}"
          echo "$MCP_INTAKE_RESP" | grep -q "deadLetterCount"
          echo "## Digital Twin Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard URL: ${TWIN_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP URL: ${TWIN_URL}/mcp" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify durable intake end to end (signed test webhook -> captured -> processed)
        env:
          TWIN_URL: ${{ steps.bicep.outputs.twin_url }}
          TWIN_API_KEY: ${{ secrets.TWIN_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          DELIVERY="twin-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          BODY=$(jq -cn --arg d "$DELIVERY" '{zen:"Durable intake verification", hook_id:0, repository:{name:"cmdemo1-digitaltwin", full_name:"clearmeasure-aisf-sample-apps/cmdemo1-digitaltwin"}, sender:{login:"twin-ci"}, delivery:$d}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          SENT_AT=$(date -u +%s)
          ACK=$(curl -fsS -X POST "${TWIN_URL}/hooks/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ping" \
            -H "X-GitHub-Delivery: ${DELIVERY}" \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            -d "$BODY")
          echo "Webhook acknowledged after durable capture: ${ACK}"
          echo "$ACK" | jq -e '.captured == true' >/dev/null

          # Processing is in capture order, so allow for a backlog (e.g. after a rebuild paused intake).
          for i in $(seq 1 300); do
            if curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/events?source=GitHub&limit=200" \
                | jq -e --arg k "github:${DELIVERY}" 'map(select(.idempotencyKey == $k)) | length == 1' >/dev/null; then
              echo "Processed into the event journal after $(( $(date -u +%s) - SENT_AT ))s (idempotency key github:${DELIVERY})"
              break
            fi
            if [ $((i % 30)) -eq 0 ]; then curl -fsS "${TWIN_URL}/api/intake/status" | jq -c '{depth, oldestPendingAgeSeconds, deadLetterCount}'; fi
            if [ "$i" -eq 300 ]; then
              echo "Test webhook ${DELIVERY} was not processed within 10 minutes" >&2
              exit 1
            fi
            sleep 2
          done

          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/intake" | jq '{transport, processorEnabled, depth, oldestPendingAgeSeconds, deadLetterCount, capturedTotal, processedTotal, lastCapturedAt, lastProcessedAt}'

          # A deploy usually ships the fix for whatever was dead-lettered, so replay and report what remains.
          DL_BEFORE=$(curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/deadletters" | jq 'length')
          echo "Dead letters before replay: ${DL_BEFORE}"
          if [ "$DL_BEFORE" -gt 0 ]; then
            curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/deadletters" | jq '[.[] | {rawEventId, exceptionType, exceptionMessage}] | .[:5]'
            curl -fsS -X POST -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/deadletters/replay" | jq .
            sleep 45
            DL_AFTER=$(curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/admin/deadletters" | jq 'length')
            echo "Dead letters after replay: ${DL_AFTER}"
            curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/intake" | jq '{depth, deadLetterCount, capturedTotal, processedTotal}'
            echo "- Dead letters replayed: ${DL_BEFORE} -> ${DL_AFTER}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Durable intake: test webhook ${DELIVERY} captured and processed" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify a real Azure change flows through Event Grid into the durable intake
        env:
          TWIN_URL: ${{ steps.bicep.outputs.twin_url }}
          TWIN_API_KEY: ${{ secrets.TWIN_API_KEY }}
        run: |
          set -euo pipefail
          RG="${TWIN_RESOURCE_GROUP}"; WS="log-${TWIN_SYSTEM_SLUG}-twin"
          # Harmless tag change on a twin-owned resource (never a resource of the observed system).
          WS_ID=$(az monitor log-analytics workspace show -g "$RG" -n "$WS" --query id -o tsv)
          PROBE="${{ github.run_id }}-${{ github.run_attempt }}"
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az tag update --resource-id "$WS_ID" --operation Merge --tags "twinIntakeProbe=${PROBE}" --output none
          echo "Tagged ${WS} (twinIntakeProbe=${PROBE}) at ${SINCE}"
          FOUND=""
          for i in $(seq 1 36); do
            FOUND=$(curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/events?source=Azure&since=${SINCE}&limit=200" \
              | jq -c --arg ws "$WS" '[.[] | select(.channel == "Webhook" and (.payloadJson | contains($ws)))] | first // empty')
            if [ -n "$FOUND" ]; then break; fi
            sleep 5
          done
          az tag update --resource-id "$WS_ID" --operation Delete --tags "twinIntakeProbe=${PROBE}" --output none
          if [ -z "$FOUND" ]; then
            echo "::error::Azure change on ${WS} did not reach the event journal within 3 minutes"
            exit 1
          fi
          echo "$FOUND" | jq '{idempotencyKey, eventType, predicate, channel, subjectId, occurredAt, capturedAt: .ingestedAt}'
          curl -fsS -H "X-Twin-Key: ${TWIN_API_KEY}" "${TWIN_URL}/api/intake" | jq '{transport, depth, deadLetterCount, capturedTotal, processedTotal}'
          echo "- Azure change via Event Grid captured and processed: $(echo "$FOUND" | jq -r .idempotencyKey)" >> "$GITHUB_STEP_SUMMARY"
