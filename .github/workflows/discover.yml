name: Discover Live Azure and Octopus Capabilities

on:
  push:
    branches:
      - cursor/cmdemo1-digitaltwin-1bc1
    paths:
      - .github/workflows/discover.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Azure capabilities and SQL/ACR/EventGrid
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          mkdir -p out
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

          # 1. Test Microsoft.EventGrid provider registration permission
          set +e
          az provider register --namespace Microsoft.EventGrid -o json > out/eventgrid-register.txt 2>&1
          echo "eventgrid_register_exit=$?" >> out/eventgrid-register.txt
          az provider show --namespace Microsoft.EventGrid --query '{namespace:namespace,registrationState:registrationState}' -o json > out/eventgrid-provider.json 2>&1

          # 2. Check ACR permissions (check token/admin capabilities without mutating yet)
          az acr show -n acrcmdemo1chu4gq -g rg-cmdemo1-nonprod -o json > out/acr-detail.json 2>&1
          az acr repository show-tags -n acrcmdemo1chu4gq --repository cmdemo1/ui --top 10 --orderby time_desc -o json > out/acr-ui-tags.json 2>&1

          # 3. Check Resource Graph subscription-wide counts (to see SQL free limit / ManagedEnvironments count)
          az rest --method post --url "https://management.azure.com/providers/Microsoft.ResourceGraph/resources?api-version=2022-10-01" \
            --body '{"subscriptions":["'"$ARM_SUBSCRIPTION_ID"'"],"query":"resources | where type in~ (\"microsoft.app/managedenvironments\", \"microsoft.sql/servers/databases\") | project name, resourceGroup, location, type, sku, freeLimit = tostring(properties.useFreeLimit)"}' \
            -o json > out/arg-sub-quotas.json 2>&1
          set -e

      - name: Check Octopus additional endpoints
        env:
          OCTOPUS_URL: ${{ secrets.OCTOPUS_URL }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/octopus
          BASE="${OCTOPUS_URL%/}"
          get_octo() { curl -fsS -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" "$BASE$1"; }
          get_octo "/api/Spaces-355/subscriptions/Subscriptions-1" | jq 'del(.EventNotificationSubscription.WebhookHeaderValue)' > out/octopus/sub1.json
          get_octo "/api/Spaces-355/runbooks?take=100" | jq '[.Items[] | {Id, Name, ProjectId, EnvironmentScope, Environments, PublishedRunbookSnapshotId}]' > out/octopus/runbooks.json
          get_octo "/api/Spaces-355/runbookRuns?take=20" | jq '[.Items[] | {Id, Name, RunbookId, ProjectId, EnvironmentId, TaskId, Created}]' > out/octopus/runbook-runs.json
          get_octo "/api/Spaces-355/build-information?take=10" | jq '[.Items[] | {Id, PackageId, Version, Branch, BuildEnvironment, VcsCommitNumber, BuildUrl, Created}]' > out/octopus/build-info.json
          get_octo "/api/Spaces-355/packages?take=10" | jq '[.Items[] | {Id, PackageId, Version, Published, FileExtension}]' > out/octopus/packages.json
          get_octo "/api/Spaces-355/channels?take=50" | jq '[.Items[] | {Id, Name, ProjectId, LifecycleId, Type, IsDefault}]' > out/octopus/channels.json
          get_octo "/api/Spaces-355/machines?take=50" | jq '[.Items[] | {Id, Name, Status, HealthStatus, EnvironmentIds, Roles}]' > out/octopus/machines.json

      - name: Upload capabilities artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmdemo1-capabilities
          path: out/
          retention-days: 1
