# Local dependencies for the digital twin. No Azure needed.
#   docker compose up -d sqlserver                      # SQL Server for `dotnet run` (tests start their own via Testcontainers)
#   docker compose --profile servicebus up -d           # optional: Service Bus emulator for future transport tests
# Credentials below are local-only development defaults.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev_Tw1n!Only"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  servicebus-sql:
    profiles: ["servicebus"]
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev_Tw1n!Only"

  servicebus:
    profiles: ["servicebus"]
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - servicebus-sql
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "LocalDev_Tw1n!Only"
    volumes:
      - ./docker/servicebus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
